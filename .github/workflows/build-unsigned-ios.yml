name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby

      - name: Build unsigned IPA
        id: build_ipa
        continue-on-error: true
        run: bash scripts/build-unsigned-ipa.sh

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa-build-logs
          path: |
            build/full-build.log
            build/pod-install.log
            build/xcodebuild-pods.log
            build/xcodebuild.log
          if-no-files-found: ignore

      - name: Upload IPA artifact
        if: steps.build_ipa.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: MathScapeAI-unsigned-ipa
          path: MathScapeAI-unsigned.ipa
          if-no-files-found: error

      - name: Fail if IPA build failed
        if: steps.build_ipa.outcome != 'success'
        run: exit 1
